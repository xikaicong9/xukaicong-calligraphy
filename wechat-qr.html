<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>添加许老师微信 - 雅趣书法教育</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: #fff;
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            max-width: 380px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #c9a84c;
            margin-bottom: 15px;
        }
        .name {
            font-size: 24px;
            font-weight: bold;
            color: #1a1a2e;
            margin-bottom: 5px;
        }
        .title {
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
        }
        .company {
            font-size: 16px;
            color: #c9a84c;
            font-weight: 600;
            margin-bottom: 25px;
        }
        .qr-container {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .qr-code {
            width: 200px;
            height: 200px;
            object-fit: contain;
        }
        .tip {
            font-size: 14px;
            color: #666;
            margin-top: 15px;
        }
        .tip strong {
            color: #c9a84c;
        }
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #c9a84c 0%, #e8c97a 100%);
            color: #1a1a2e;
            padding: 15px 40px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            margin-top: 10px;
            transition: transform 0.3s;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .back-link {
            display: block;
            margin-top: 20px;
            color: #999;
            font-size: 13px;
            text-decoration: none;
        }
        .back-link:hover {
            color: #c9a84c;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="teacher.jpg" alt="许开聪" class="avatar" onerror="this.style.display='none'">
        <div class="name">许开聪</div>
        <div class="title">书法教育导师 / 卷面书写专家</div>
        <div class="company">雅趣书法教育</div>
        
        <div class="qr-container">
            <img src="wechat-qr.jpg" alt="微信二维码" class="qr-code">
            <div class="tip">
                <strong>👆 长按识别二维码</strong><br>
                添加我的企业微信咨询
            </div>
        </div>
        
        <a href="index.html" class="btn">返回官网</a>
        <a href="index.html" class="back-link">← 返回许开聪书法教育官网</a>
    </div>
</body>
</html>
